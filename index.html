<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🧊 冰箱清冰箱料理助手</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-4 sm:py-8 px-3 sm:px-4">
    <div class="max-w-xl mx-auto space-y-4 sm:space-y-6">
        
        <!-- 標題區塊 -->
        <header class="text-center space-y-1.5">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-orange-100 text-orange-600 rounded-2xl shadow-inner text-xl mb-1">
                🍳
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900">冰箱清冰箱料理助手</h1>
            <p class="text-xs sm:text-sm text-slate-500">勾選現有食材，為小家庭規劃溫馨家常菜與專屬成品照！</p>
        </header>

        <!-- 設定 API Key 區塊 -->
        <section class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex items-center justify-between mb-2">
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Gemini API Key 設定</label>
                <span class="text-xs text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full font-medium">僅存本機端</span>
            </div>
            <input type="password" id="apiKeyInput" placeholder="請輸入您的 Gemini API Key" 
                   class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 text-sm transition">
        </section>

        <!-- 主功能面板 -->
        <main class="space-y-4 sm:space-y-6">
            
            <!-- 食材勾選區塊 (分類呈現) -->
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-5">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h2 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                        <span>🛒</span> 現有食材清單
                    </h2>
                    <button onclick="clearAll()" class="text-xs text-rose-500 hover:text-rose-600 font-medium transition py-1 px-2">清除所有勾選</button>
                </div>

                <!-- 分類容器 -->
                <div id="ingredientCategories" class="space-y-4">
                    <!-- 動態載入分類 -->
                </div>

                <!-- 自訂新增食材輸入與分類選擇 -->
                <div class="pt-4 border-t border-slate-100 space-y-2.5">
                    <label class="block text-xs font-semibold text-slate-500">新增自訂食材</label>
                    <div class="flex flex-col gap-2">
                        <div class="flex gap-2">
                            <input type="text" id="customIngredientInput" placeholder="輸入食材名稱（例如：杏鮑菇）" 
                                   class="flex-1 px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition"
                                   onkeypress="if(event.key === 'Enter') addCustomIngredient()">
                            
                            <button onclick="addCustomIngredient()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition whitespace-nowrap shadow-sm">加入</button>
                        </div>
                        <select id="customCategorySelect" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition">
                            <option value="🥩 肉品與海鮮">🥩 肉品與海鮮</option>
                            <option value="🥬 蔬菜與菇類" selected>🥬 蔬菜與菇類</option>
                            <option value="🥚 蛋奶與豆製品">🥚 蛋奶與豆製品</option>
                            <option value="🍚 主食與其他">🍚 主食與其他</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 料理偏好設定區塊 -->
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h2 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                    <span>⚙️</span> 料理偏好設定
                </h2>

                <div class="grid grid-cols-1 gap-3 sm:grid-cols-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">料理道數</label>
                        <select id="recipeCount" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition">
                            <option value="1">1 道菜</option>
                            <option value="2" selected>2 道菜</option>
                            <option value="3">3 道菜</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">菜系風味</label>
                        <select id="cuisineStyle" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition">
                            <option value="不拘 / 隨主廚發揮">不拘 / 隨主廚發揮</option>
                            <option value="中式家常">中式家常</option>
                            <option value="日式風味">日式風味</option>
                            <option value="西式 / 義式">西式 / 義式</option>
                            <option value="韓式風味">韓式風味</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">料理風格</label>
                        <select id="cookingVibe" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-orange-500/20 focus:border-orange-500 transition">
                            <option value="溫馨家常菜" selected>溫馨家常菜</option>
                            <option value="快速上菜 (15分鐘內)">快速上菜 (15分鐘內)</option>
                            <option value="健康低卡">健康低卡</option>
                            <option value="豐盛大餐">豐盛大餐</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- 生成按鈕 -->
            <button onclick="generateRecipes()" id="submitBtn" 
                    class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 px-6 rounded-2xl shadow-md transition duration-200 flex items-center justify-center gap-2 text-base active:scale-[0.99]">
                <span>🍳</span> 為我們生成今天的溫馨食譜與專屬圖片！
            </button>

            <!-- 結果顯示區塊 -->
            <div id="resultSection" class="hidden bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-100 pb-3">
                    <span>✨</span> 主廚特選食譜與成品預覽
                </h3>
                <div id="recipeOutput" class="space-y-6 text-slate-700 leading-relaxed text-sm sm:text-base">
                    <!-- 載入中動畫或結果 -->
                </div>
            </div>

            <!-- 近期料理歷史紀錄區塊 -->
            <div class="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                    <h3 class="text-base sm:text-lg font-bold text-slate-800 flex items-center gap-2">
                        <span>📖</span> 近期料理歷史紀錄
                    </h3>
                    <button onclick="clearHistory()" class="text-xs text-rose-500 hover:text-rose-600 font-medium transition py-1 px-2">清空紀錄</button>
                </div>
                <div id="historyList" class="space-y-3">
                    <p class="text-xs text-slate-400 text-center py-4">尚無歷史紀錄，趕快來生成第一道菜吧！</p>
                </div>
            </div>
        </main>

        <!-- 頁尾 -->
        <footer class="text-center text-xs text-slate-400 py-2">
            Bon Appétit! 祝您用餐愉快 🧡
        </footer>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        const defaultCategories = {
            "🥩 肉品與海鮮": ["牛排", "豬肉片", "雞肉", "豬絞肉", "培根", "香腸", "蝦仁", "鮭魚片", "鯖魚", "花枝"],
            "🥬 蔬菜與菇類": ["高麗菜", "洋蔥", "紅蘿蔔", "番茄", "青蔥", "蒜頭", "馬鈴薯", "花椰菜", "大白菜", "香菇", "四季豆"],
            "🥚 蛋奶與豆製品": ["雞蛋", "豆腐", "起司", "牛奶", "豆漿"],
            "🍚 主食與其他": ["白米", "泡麵", "白麵條", "水餃", "吐司"]
        };

        let customCategories = JSON.parse(localStorage.getItem('customCategories')) || {
            "🥩 肉品與海鮮": [],
            "🥬 蔬菜與菇類": [],
            "🥚 蛋奶與豆製品": [],
            "🍚 主食與其他": []
        };

        function init() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }

            document.getElementById('apiKeyInput').addEventListener('input', (e) => {
                localStorage.setItem('gemini_api_key', e.target.value.trim());
            });

            renderIngredients();
            renderHistory();
        }

        function renderIngredients() {
            const container = document.getElementById('ingredientCategories');
            const savedChecked = JSON.parse(localStorage.getItem('checkedIngredients')) || [];
            
            let html = '';
            const allCategoryKeys = Object.keys(defaultCategories);

            allCategoryKeys.forEach(catName => {
                const defaultItems = defaultCategories[catName] || [];
                const customItems = customCategories[catName] || [];
                const combinedItems = [...defaultItems, ...customItems];

                html += `
                    <div class="space-y-2">
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-400">${catName}</h4>
                        <div class="grid grid-cols-2 gap-2">
                `;

                combinedItems.forEach(item => {
                    const isChecked = savedChecked.includes(item) ? 'checked' : '';
                    html += `
                        <label class="flex items-center space-x-2.5 p-3 bg-slate-50/70 border border-slate-100 rounded-xl hover:bg-orange-50/50 hover:border-orange-200 cursor-pointer transition select-none">
                            <input type="checkbox" value="${item}" ${isChecked} onchange="saveState()" class="ingredient-checkbox w-4 h-4 text-orange-500 rounded focus:ring-orange-500/20 border-slate-300">
                            <span class="text-sm font-medium text-slate-700 truncate">${item}</span>
                        </label>
                    `;
                });

                html += `</div></div>`;
            });

            container.innerHTML = html;
        }

        function addCustomIngredient() {
            const input = document.getElementById('customIngredientInput');
            const select = document.getElementById('customCategorySelect');
            const val = input.value.trim();
            const targetCategory = select.value;

            if (!val) return;

            let allExistingItems = [];
            Object.values(defaultCategories).forEach(arr => allExistingItems.push(...arr));
            Object.values(customCategories).forEach(arr => allExistingItems.push(...arr));

            if (!allExistingItems.includes(val)) {
                if (!customCategories[targetCategory]) {
                    customCategories[targetCategory] = [];
                }
                customCategories[targetCategory].push(val);
                localStorage.setItem('customCategories', JSON.stringify(customCategories));
                
                let savedChecked = JSON.parse(localStorage.getItem('checkedIngredients')) || [];
                savedChecked.push(val);
                localStorage.setItem('checkedIngredients', JSON.stringify(savedChecked));

                input.value = '';
                renderIngredients();
            } else {
                alert('這個食材已經存在清單中囉！');
            }
        }

        function saveState() {
            const checkboxes = document.querySelectorAll('.ingredient-checkbox');
            const checked = Array.from(checkboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);
            localStorage.setItem('checkedIngredients', JSON.stringify(checked));
        }

        function clearAll() {
            localStorage.removeItem('checkedIngredients');
            renderIngredients();
        }

        function getFormattedDate() {
            const now = new Date();
            const weekdays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            const weekday = weekdays[now.getDay()];
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            return `${month}月${date}日 (${weekday}) ${hours}:${minutes}`;
        }

        function saveHistory(recipeText, ingredientsUsed) {
            let history = JSON.parse(localStorage.getItem('recipeHistory')) || [];
            const newEntry = {
                id: Date.now(),
                timeStr: getFormattedDate(),
                ingredients: ingredientsUsed,
                content: recipeText
            };
            history.unshift(newEntry);
            if (history.length > 10) history.pop();
            localStorage.setItem('recipeHistory', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const historyListDiv = document.getElementById('historyList');
            let history = JSON.parse(localStorage.getItem('recipeHistory')) || [];

            if (history.length === 0) {
                historyListDiv.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">尚無歷史紀錄，趕快來生成第一道菜吧！</p>`;
                return;
            }

            historyListDiv.innerHTML = history.map(item => `
                <div class="p-3.5 bg-slate-50 border border-slate-100 rounded-xl space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-orange-600 bg-orange-50 px-2 py-0.5 rounded-lg">🕒 ${item.timeStr}</span>
                        <div class="space-x-3">
                            <button onclick="viewHistory(${item.id})" class="text-xs text-slate-600 hover:text-slate-900 font-medium underline">查看</button>
                            <button onclick="deleteHistoryItem(${item.id})" class="text-xs text-rose-500 hover:text-rose-600 font-medium">刪除</button>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 truncate">使用食材：${item.ingredients.join('、')}</p>
                </div>
            `).join('');
        }

        function viewHistory(id) {
            let history = JSON.parse(localStorage.getItem('recipeHistory')) || [];
            const target = history.find(h => h.id === id);
            if (target) {
                const outputDiv = document.getElementById('recipeOutput');
                const resultSection = document.getElementById('resultSection');
                resultSection.classList.remove('hidden');
                outputDiv.innerHTML = `
                    <div class="mb-3 text-xs font-bold text-slate-400 pb-2 border-b border-slate-100">檢視歷史紀錄：${target.timeStr}</div>
                    <div class="space-y-4 text-sm sm:text-base overflow-hidden">${target.content}</div>
                `;
                window.scrollTo({ top: resultSection.offsetTop - 20, behavior: 'smooth' });
            }
        }

        function deleteHistoryItem(id) {
            let history = JSON.parse(localStorage.getItem('recipeHistory')) || [];
            history = history.filter(h => h.id !== id);
            localStorage.setItem('recipeHistory', JSON.stringify(history));
            renderHistory();
        }

        function clearHistory() {
            if (confirm('確定要清空所有歷史紀錄嗎？')) {
                localStorage.removeItem('recipeHistory');
                renderHistory();
            }
        }

        async function generateRecipes() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert('請先輸入您的 Gemini API Key！');
                return;
            }

            saveState();
            const checked = JSON.parse(localStorage.getItem('checkedIngredients')) || [];
            if (checked.length === 0) {
                alert('請至少勾選一項食材！');
                return;
            }

            const count = document.getElementById('recipeCount').value;
            const cuisine = document.getElementById('cuisineStyle').value;
            const vibe = document.getElementById('cookingVibe').value;

            const outputDiv = document.getElementById('recipeOutput');
            const resultSection = document.getElementById('resultSection');
            const submitBtn = document.getElementById('submitBtn');

            resultSection.classList.remove('hidden');
            outputDiv.innerHTML = `
                <div class="text-center py-10 space-y-3">
                    <div class="inline-block animate-spin text-2xl">🍳</div>
                    <p class="text-slate-400 font-medium text-sm">溫馨主廚正在規劃 ${count} 道家常菜並挑選專屬成品照...</p>
                </div>`;
            submitBtn.disabled = true;

            // 強制 AI 透過 HTML 結構輸出，並針對每道菜給予對應的圖片關鍵字
            const prompt = `我目前手邊有的冰箱食材有：${checked.join('、')}。
請以專業主廚的角度，為小家庭設計 ${count} 道溫馨家常的美味料理。
【特別需求】：
- 菜系風格：${cuisine}
- 料理風格/情境：${vibe}
- 可以搭配一般家裡一定會有的基礎調味料（如鹽、油、醬油、糖、白胡椒等）。

請**嚴格使用 HTML 標籤**輸出（絕對不要使用 Markdown 程式碼區塊如 \`\`\`html 或 \`\`\`json 等符號）。
每一道料理請用一個帶有邊框或區塊感的 div 包覆，格式如下：
<div class="mb-6 p-4 bg-orange-50/40 border border-orange-100 rounded-2xl space-y-3">
  <h4 class="text-base font-bold text-slate-950">1. 料理名稱</h4>
  <img src="https://source.unsplash.com/600x400/?【請在此填入 1 到 2 個最符合這道菜的英文美食關鍵字，例如 stir-fried pork 或 fish soup】" alt="料理成品照" class="w-full h-48 object-cover rounded-xl shadow-sm">
  <p class="text-xs font-semibold text-orange-700">主廚推薦原因與特色</p>
  <p class="text-sm text-slate-700">主要食材與份量說明...</p>
  <p class="text-sm text-slate-700">詳細烹調步驟...</p>
  <p class="text-xs text-slate-500 bg-white p-2.5 rounded-xl border border-slate-100">💡 貼心小建議：...</p>
</div>`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let text = data.candidates[0].content.parts[0].text;

                // 移除可能殘留的 markdown 標記以防萬一
                text = text.replace(/```html/g, '').replace(/```json/g, '').replace(/```/g, '');

                outputDiv.innerHTML = `<div class="space-y-4">${text}</div>`;
                saveHistory(text, checked);

            } catch (error) {
                outputDiv.innerHTML = `<div class="p-4 bg-rose-50 text-rose-600 rounded-xl font-medium text-sm">發生錯誤：${error.message}</div>`;
            } finally {
                submitBtn.disabled = false;
            }
        }

        init();
    </script>
</body>
</html>
