<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清冰箱料理助手</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-6">
    <div class="max-w-3xl mx-auto p-4 sm:p-6">
        
        <!-- 標題 -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900 mb-2">🧊 冰箱清冰箱料理助手</h1>
            <p class="text-slate-500">勾選現有食材，一鍵解鎖美味小家庭料理！</p>
        </header>

        <!-- 設定 API Key 區塊 -->
        <section class="bg-white p-4 rounded-xl shadow-sm mb-6 border border-slate-200">
            <label class="block text-sm font-medium text-slate-700 mb-1">Gemini API Key (僅存放在您的瀏覽器端，安全無虞)：</label>
            <input type="password" id="apiKeyInput" placeholder="請輸入您的 Gemini API Key" 
                   class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
        </section>

        <!-- 食材清單區塊 -->
        <main class="space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-xl font-semibold text-slate-800">🛒 現有食材勾選</h2>
                    <button onclick="clearAll()" class="text-xs text-rose-500 hover:underline">清除所有勾選</button>
                </div>

                <!-- 豐富的常見固定食材 -->
                <div id="ingredientCategories" class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-6">
                    <!-- 動態帶入 -->
                </div>

                <!-- 自訂新增食材輸入框 -->
                <div class="flex gap-2 pt-4 border-t border-slate-100">
                    <input type="text" id="customIngredientInput" placeholder="新增其他食材（例如：杏鮑菇、花椰菜）" 
                           class="flex-1 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <button onclick="addCustomIngredient()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm hover:bg-slate-700 transition">新增</button>
                </div>
            </div>

            <!-- 生成按鈕 -->
            <button onclick="generateRecipes()" id="submitBtn" 
                    class="w-full bg-indigo-600 text-white font-semibold py-3 px-6 rounded-xl shadow-md hover:bg-indigo-500 transition flex items-center justify-center gap-2">
                <span>🍳 告訴我今天能煮什麼！</span>
            </button>

            <!-- 結果顯示區塊 -->
            <div id="resultSection" class="hidden bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h3 class="text-xl font-semibold mb-4 text-slate-800">✨ 主廚推薦料理</h3>
                <div id="recipeOutput" class="space-y-4 text-slate-700 leading-relaxed">
                    <!-- 載入中動畫或結果 -->
                </div>
            </div>
        </main>
    </div>

    <!-- JavaScript 邏輯 -->
    <script>
        // 豐富的常見冰箱食材清單
        const defaultIngredients = [
            // 蛋奶豆製品
            "雞蛋", "豆腐", "起司", "牛奶", "豆漿",
            // 肉品類
            "牛排", "豬肉片", "雞肉", "豬絞肉", "培根", "香腸",
            // 海鮮類
            "蝦仁", "鮭魚片", "鯖魚", "花枝",
            // 蔬菜類
            "高麗菜", "洋蔥", "紅蘿蔔", "番茄", "青蔥", "蒜頭", 
            "馬鈴薯", "花椰菜", "大白菜", "香菇", "四季豆",
            // 主食與其他
            "白米", "泡麵", "白麵條", "水餃", "吐司"
        ];

        let customIngredients = JSON.parse(localStorage.getItem('customIngredients')) || [];

        function init() {
            // 載入儲存的 API Key
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }

            // 監聽 API Key 變動並自動儲存
            document.getElementById('apiKeyInput').addEventListener('input', (e) => {
                localStorage.setItem('gemini_api_key', e.target.value.trim());
            });

            renderIngredients();
        }

        function renderIngredients() {
            const container = document.getElementById('ingredientCategories');
            const savedChecked = JSON.parse(localStorage.getItem('checkedIngredients')) || [];
            
            // 合併預設與自訂
            const combined = [...defaultIngredients, ...customIngredients];
            
            container.innerHTML = combined.map(item => {
                const isChecked = savedChecked.includes(item) ? 'checked' : '';
                return `
                    <label class="flex items-center space-x-2 p-2.5 border border-slate-100 rounded-lg hover:bg-slate-50 cursor-pointer transition">
                        <input type="checkbox" value="${item}" ${isChecked} onchange="saveState()" class="ingredient-checkbox w-4 h-4 text-indigo-600 rounded focus:ring-indigo-500">
                        <span class="text-sm font-medium text-slate-700">${item}</span>
                    </label>
                `;
            }).join('');
        }

        function addCustomIngredient() {
            const input = document.getElementById('customIngredientInput');
            const val = input.value.trim();
            if (!val) return;

            if (!defaultIngredients.includes(val) && !customIngredients.includes(val)) {
                customIngredients.push(val);
                localStorage.setItem('customIngredients', JSON.stringify(customIngredients));
                
                // 同時自動勾選新加的食材
                let savedChecked = JSON.parse(localStorage.getItem('checkedIngredients')) || [];
                savedChecked.push(val);
                localStorage.setItem('checkedIngredients', JSON.stringify(savedChecked));

                input.value = '';
                renderIngredients();
            }
        }

        function saveState() {
            const checkboxes = document.querySelectorAll('.ingredient-checkbox');
            const checked = Array.from(checkboxes)
                .filter(cb => cb.checked)
                .map(cb => cb.value);
            localStorage.setItem('checkedIngredients', JSON.stringify(checked));
        }

        function clearAll() {
            localStorage.removeItem('checkedIngredients');
            renderIngredients();
        }

        async function generateRecipes() {
            const apiKey = document.getElementById('apiKeyInput').value.trim();
            if (!apiKey) {
                alert('請先輸入您的 Gemini API Key！');
                return;
            }

            saveState();
            const checked = JSON.parse(localStorage.getItem('checkedIngredients')) || [];
            if (checked.length === 0) {
                alert('請至少勾選一項食材！');
                return;
            }

            const outputDiv = document.getElementById('recipeOutput');
            const resultSection = document.getElementById('resultSection');
            const submitBtn = document.getElementById('submitBtn');

            resultSection.classList.remove('hidden');
            outputDiv.innerHTML = `<div class="text-center py-6 text-slate-400">主廚正在絞盡腦汁為您規劃食譜中... 🍳</div>`;
            submitBtn.disabled = true;

            const prompt = `我目前手邊有的冰箱食材有：${checked.join('、')}。
請以專業主廚的角度，為小家庭設計 2 道可以利用這些現有食材完成的美味料理（可以搭配一般家裡一定會有的基礎調味料如鹽、油、醬油、糖等）。
請用清晰的 HTML 排版或 Markdown 格式回答，包含：
1. 料理名稱
2. 需要用到的食材與份量
3. 詳細的烹調步驟
4. 貼心小建議（例如可以替換的配料）`;

            try {
                // 呼叫 Gemini API (使用最新的 gemini-3.6-flash 模型)
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const text = data.candidates[0].content.parts[0].text;
                outputDiv.innerHTML = `<div class="prose max-w-none">${text.replace(/\n/g, '<br>')}</div>`;
            } catch (error) {
                outputDiv.innerHTML = `<div class="text-rose-500 font-medium">發生錯誤：${error.message}</div>`;
            } finally {
                submitBtn.disabled = false;
            }
        }

        // 初始化執行
        init();
    </script>
</body>
</html>
